<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saila Society — WTP</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saila Society">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --navy:#1F3A5F; --blue:#4472C4; --green:#2E7D32; --red:#C62828;
    --amber:#BF8F00; --teal:#00838F; --bg:#EEF2F7; --card:#ffffff;
    --mute:#7b8491; --border:#E2E8F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #1a1f2b; padding: 14px 12px 80px; font-size: 13px; }

  .header { margin-bottom: 18px; }
  .header h1 { font-size: 19px; font-weight: 700; color: var(--navy); letter-spacing: -0.3px; }
  .header .stamp { font-size: 11px; color: var(--mute); margin-top: 2px; }

  /* Balance pill */
  .balance-card {
    background: var(--navy); color: #fff; border-radius: 14px;
    padding: 18px 16px; margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(31,58,95,0.25);
  }
  .balance-lbl { font-size: 11px; font-weight: 600; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .balance-amt { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .balance-sub { font-size: 11.5px; opacity: 0.7; margin-top: 4px; }

  .section-title {
    font-size: 11px; font-weight: 700; color: var(--mute);
    text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px;
  }

  .doc-card {
    background: var(--card); border-radius: 12px; padding: 13px 15px;
    margin-bottom: 10px; box-shadow: 0 1px 3px rgba(20,35,60,0.07);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-left: 4px solid var(--teal);
  }
  .doc-name { font-size: 13px; font-weight: 600; color: var(--navy); flex: 1; min-width: 0; word-break: break-word; line-height: 1.35; }
  .doc-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--navy); color: #fff; border-radius: 8px;
    padding: 8px 12px; font-size: 11.5px; font-weight: 700;
    text-decoration: none; flex-shrink: 0;
  }
  .doc-btn:active { opacity: 0.85; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--mute); }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--mute); }
  .error { color: var(--red); }

  .refresh { position: fixed; bottom: 72px; right: 16px; background: var(--navy); color: #fff; border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; box-shadow: 0 4px 12px rgba(31,58,95,0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .refresh.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; height: 60px; box-shadow: 0 -2px 8px rgba(20,35,60,0.08); z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mute); font-size: 9.5px; font-weight: 600; letter-spacing: 0.3px; }
  .nav-item .nav-icon { font-size: 20px; line-height: 1; }
  .nav-item.active { color: var(--navy); }
</style>
</head>
<body>

<div class="header">
  <h1>💧 WTP</h1>
  <div class="stamp" id="stamp">Loading…</div>
</div>

<div id="loading" class="loading">Loading…</div>
<div id="content" style="display:none"></div>

<button class="refresh" id="refreshBtn" onclick="load()" title="Refresh">↻</button>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a class="nav-item" href="details.html"><span class="nav-icon">📊</span>Details</a>
  <a class="nav-item" href="issues.html"><span class="nav-icon">🔧</span>Issues</a>
  <a class="nav-item active" href="more.html"><span class="nav-icon">☰</span>More</a>
</nav>

<script>
  const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function load() {
    document.getElementById('refreshBtn').classList.add('spin');
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').className = 'loading';
    document.getElementById('loading').textContent = 'Loading…';
    document.getElementById('content').style.display = 'none';

    fetch('./data.json?t=' + Date.now())
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(txt => {
        let d; try{d=JSON.parse(txt);}catch(e){throw new Error('Bad JSON');}
        document.getElementById('stamp').textContent = 'Updated ' + (d.generatedAt||'');
        render(d);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('refreshBtn').classList.remove('spin');
      })
      .catch(err => {
        document.getElementById('loading').className = 'error';
        document.getElementById('loading').textContent = 'Error: ' + err.message;
        document.getElementById('refreshBtn').classList.remove('spin');
      });
  }

  function render(d) {
    const el = document.getElementById('content');
    const bal = Number(d.wtpBalance) || 0;
    const docs = d.wtpDocs || [];

    let html = `
      <div class="balance-card">
        <div class="balance-lbl">💧 WTP Account Balance</div>
        <div class="balance-amt">₹${bal.toLocaleString('en-IN')}</div>
        <div class="balance-sub">Water Treatment Plant Fund</div>
      </div>`;

    if (docs.length) {
      html += `<div class="section-title">Payment Documents</div>`;
      html += docs.map(doc => `
        <div class="doc-card">
          <div class="doc-name">${esc(doc.name)}</div>
          ${doc.pdfLink ? `<a class="doc-btn" href="${esc(doc.pdfLink)}" target="_blank" rel="noopener">📄 View</a>` : ''}
        </div>`).join('');
    } else {
      html += `<div class="empty-state"><p style="color:var(--mute);font-size:13px;">No payment documents uploaded yet.</p></div>`;
    }

    el.innerHTML = html;
  }

  load();
</script>
</body>
</html>
