<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saila Society — Financials</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saila Society">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --navy:#1F3A5F; --blue:#4472C4; --green:#2E7D32; --red:#C62828;
    --amber:#BF8F00; --teal:#00838F; --bg:#EEF2F7; --card:#ffffff;
    --mute:#7b8491; --border:#E2E8F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #1a1f2b; padding: 14px 12px 80px; font-size: 13px; }
  .header { margin-bottom: 14px; }
  .header h1 { font-size: 19px; font-weight: 700; color: var(--navy); letter-spacing: -0.3px; }
  .header .stamp { font-size: 11px; color: var(--mute); margin-top: 2px; }
  .section-title { font-size: 10.5px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(20,35,60,0.07); }
  .exp-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .exp-table th { text-align: right; font-size: 10px; font-weight: 700; color: var(--mute); padding: 0 4px 6px; border-bottom: 1px solid var(--border); }
  .exp-table th:first-child { text-align: left; }
  .exp-table td { padding: 6px 4px; border-bottom: 1px solid #f0f2f5; text-align: right; color: #2d3748; }
  .exp-table td:first-child { text-align: left; font-weight: 500; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-table tr:last-child td { border-bottom: none; font-weight: 700; color: var(--navy); padding-top: 8px; border-top: 2px solid var(--border); }
  .exp-table .zero { color: #c8cdd6; }
  .top-exp-card { background: #FFF8E1; border: 1.5px solid #FFD54F; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(20,35,60,0.07); }
  .top-exp-card h2 { font-size: 11px; margin: 0 0 12px; color: #7a5800; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
  .tx { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #ffe082; }
  .tx:last-child { border-bottom: none; padding-bottom: 0; }
  .tx .left { flex: 1; min-width: 0; padding-right: 8px; }
  .tx .item { font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .meta { font-size: 10.5px; color: var(--amber); margin-top: 2px; }
  .tx .cat  { color: var(--amber); font-weight: 600; }
  .tx .amt  { font-weight: 700; color: var(--red); font-size: 13px; white-space: nowrap; }
  .rank-badge { width: 20px; height: 20px; border-radius: 50%; background: var(--amber); color: #fff; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 8px; }
  .tx-inner { display: flex; align-items: center; flex: 1; min-width: 0; }
  .exp-log-month { background: var(--card); border-radius: 12px; padding: 14px 10px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(20,35,60,0.07); }
  .exp-log-month-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .exp-log-month-head .mo-total { color: var(--red); font-size: 13px; }
  .exp-log-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .exp-log-table th { font-size: 10px; font-weight: 700; color: var(--mute); padding: 0 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  .exp-log-table th.amt { text-align: right; }
  .exp-log-table td { padding: 6px 4px; border-bottom: 1px solid #f0f2f5; color: #2d3748; text-align: left; vertical-align: top; }
  .exp-log-table td.amt { text-align: right; color: var(--red); font-weight: 600; white-space: nowrap; }
  .exp-log-table td.dt  { color: var(--mute); white-space: nowrap; font-size: 10.5px; }
  .exp-log-table td.cat { color: var(--teal); font-size: 10.5px; }
  .exp-log-table td.itm { font-weight: 500; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-log-table tr.total-row td { border-bottom: none; border-top: 2px solid var(--border); font-weight: 700; color: var(--navy); padding-top: 8px; }
  canvas { max-width: 100%; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--mute); }
  .error { color: var(--red); }
  .empty { color: var(--mute); padding: 8px 0; font-size: 12px; }
  .refresh { position: fixed; bottom: 72px; right: 16px; background: var(--navy); color: #fff; border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; box-shadow: 0 4px 12px rgba(31,58,95,0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .refresh:active { transform: scale(0.95); }
  .refresh.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; height: 60px; box-shadow: 0 -2px 8px rgba(20,35,60,0.08); z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mute); font-size: 9.5px; font-weight: 600; letter-spacing: 0.3px; }
  .nav-item .nav-icon { font-size: 20px; line-height: 1; }
  .nav-item.active { color: var(--navy); }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Financial Details</h1>
  <div class="stamp" id="stamp">Loading…</div>
</div>

<div id="content" style="display:none">

  <div class="section-title">Last 3 Month Expense Details</div>
  <div class="card" style="padding:14px 10px;">
    <div style="overflow-x:auto">
      <table class="exp-table">
        <thead><tr id="last3-head"></tr></thead>
        <tbody id="last3-body"></tbody>
      </table>
    </div>
  </div>

  <div class="section-title">Expense Log — Last 2 Months</div>
  <div id="exp-log-section"></div>

  <div class="section-title">Expense by Category (YTD)</div>
  <div class="card"><canvas id="chart-cat" height="240"></canvas></div>

  <div class="section-title">Collection vs Expense — All Months</div>
  <div class="card"><canvas id="chart-combined"></canvas></div>

  <div class="section-title">Top Expenses — All Time</div>
  <div class="top-exp-card">
    <h2>⭐ Highest Expenses</h2>
    <div id="top-expenses"></div>
  </div>

</div>

<div id="loading" class="loading">Loading…</div>
<button class="refresh" id="refreshBtn" onclick="load()" title="Refresh">↻</button>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a class="nav-item active" href="details.html"><span class="nav-icon">📊</span>Details</a>
  <a class="nav-item" href="issues.html"><span class="nav-icon">🔧</span>Issues</a>
  <a class="nav-item" href="more.html"><span class="nav-icon">☰</span>More</a>
</nav>

<script>
  const fmtINR = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
  const compact = n => { const v=Number(n)||0; if(Math.abs(v)>=100000) return '₹'+(v/100000).toFixed(1)+'L'; if(Math.abs(v)>=1000) return '₹'+(v/1000).toFixed(1)+'k'; return '₹'+v; };
  const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let catChart, cmbChart;

  function load() {
    document.getElementById('refreshBtn').classList.add('spin');
    document.getElementById('content').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').className = 'loading';
    document.getElementById('loading').textContent = 'Loading…';
    fetch('./data.json?t=' + Date.now())
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(txt => { let d; try{d=JSON.parse(txt);}catch(ex){throw new Error('Bad JSON');} render(d); document.getElementById('refreshBtn').classList.remove('spin'); })
      .catch(err => { document.getElementById('loading').className='error'; document.getElementById('loading').textContent='Error: '+err.message; document.getElementById('refreshBtn').classList.remove('spin'); });
  }

  function render(d) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('stamp').textContent = 'Updated ' + d.generatedAt;

    const fmtDate = s => { if(!s) return ''; const p=s.split('-'); if(p.length<3) return s; const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return p[2]+' '+ms[Number(p[1])-1]; };

    // Last 3 months table
    const thead = document.getElementById('last3-head');
    const tbody = document.getElementById('last3-body');
    thead.innerHTML = '<th>Category</th>' + (d.last3Labels||[]).map(l=>`<th>${esc(l)}</th>`).join('') + '<th>Total</th>';
    if (d.last3Table && d.last3Table.length) {
      tbody.innerHTML = d.last3Table.map(row =>
        `<tr><td>${esc(row.category)}</td>${(row.months||[]).map(v=>`<td class="${v?'':'zero'}">${v?compact(v):'–'}</td>`).join('')}<td>${compact(row.total)}</td></tr>`
      ).join('') +
      `<tr><td>Total</td>${(d.last3Totals||[]).map(v=>`<td>${compact(v)}</td>`).join('')}<td>${compact((d.last3Totals||[]).reduce((a,b)=>a+b,0))}</td></tr>`;
    }

    // Expense log
    const expLogDiv = document.getElementById('exp-log-section');
    if (d.expenseLogLast2 && d.expenseLogLast2.length) {
      expLogDiv.innerHTML = d.expenseLogLast2.map(mo =>
        `<div class="exp-log-month">
          <div class="exp-log-month-head"><span>📅 ${esc(mo.month)}</span><span class="mo-total">${fmtINR(mo.total)}</span></div>
          <div style="overflow-x:auto">
            <table class="exp-log-table">
              <thead><tr><th>Date</th><th>Item / Description</th><th>Category</th><th class="amt">Amount</th></tr></thead>
              <tbody>
                ${mo.entries.map(e=>`<tr><td class="dt">${esc(fmtDate(e.date))}</td><td class="itm">${esc(e.item||e.category)}</td><td class="cat">${esc(e.category)}</td><td class="amt">${fmtINR(e.amount)}</td></tr>`).join('')}
                <tr class="total-row"><td colspan="3" style="text-align:right">Monthly Total</td><td class="amt">${fmtINR(mo.total)}</td></tr>
              </tbody>
            </table>
          </div>
        </div>`
      ).join('');
    } else {
      expLogDiv.innerHTML = '<div class="exp-log-month"><div class="empty" style="text-align:center;padding:16px 0;">No expense log data available.</div></div>';
    }

    // Doughnut chart — after expense log
    // Use d.categories if populated; otherwise derive from topExpenses
    let catData = (d.categories && d.categories.length) ? d.categories : [];
    if (!catData.length && d.topExpenses && d.topExpenses.length) {
      const map = {};
      d.topExpenses.forEach(e => {
        const cat = e.category || 'Other';
        map[cat] = (map[cat] || 0) + (Number(e.amount) || 0);
      });
      catData = Object.entries(map)
        .map(([category, amount]) => ({ category, amount }))
        .sort((a, b) => b.amount - a.amount);
    }
    const catColors = ['#4472C4','#C62828','#2E7D32','#BF8F00','#7B1FA2','#0097A7','#EF6C00','#455A64','#00838F','#9E9E9E'];
    if (catChart) catChart.destroy();
    if (catData.length) {
      catChart = new Chart(document.getElementById('chart-cat'), {
        type: 'doughnut',
        data: { labels: catData.map(c=>c.category), datasets: [{ data: catData.map(c=>c.amount), backgroundColor: catColors, borderWidth: 0 }] },
        options: { cutout:'56%', plugins: { legend:{ position:'bottom', labels:{ font:{size:10}, boxWidth:10, padding:7 } }, tooltip:{ callbacks:{ label: ctx => ctx.label+': '+fmtINR(ctx.raw) } } } }
      });
    } else {
      document.getElementById('chart-cat').parentElement.innerHTML = '<div class="empty" style="text-align:center;padding:20px 0;">No expense data available.</div>';
    }

    // Bar chart
    const barH = Math.max(200, d.combined.length * 28);
    document.getElementById('chart-combined').height = barH;
    if (cmbChart) cmbChart.destroy();
    cmbChart = new Chart(document.getElementById('chart-combined'), {
      type: 'bar',
      data: { labels: d.combined.map(m=>m.label), datasets: [
        { label:'Collection', data: d.combined.map(m=>m.collection), backgroundColor:'#2E7D32', borderRadius:3 },
        { label:'Expense',    data: d.combined.map(m=>m.expense),    backgroundColor:'#C62828', borderRadius:3 }
      ]},
      options: { indexAxis:'y', plugins:{ legend:{ position:'bottom', labels:{ font:{size:10}, boxWidth:12 } }, tooltip:{ callbacks:{ label: ctx => ctx.dataset.label+': '+fmtINR(ctx.raw) } } }, scales:{ x:{ ticks:{ callback: v=>compact(v), font:{size:9} }, grid:{color:'#eef0f4'} }, y:{ ticks:{font:{size:10}}, grid:{display:false} } } }
    });

    // Top expenses
    const topDiv = document.getElementById('top-expenses');
    topDiv.innerHTML = (d.topExpenses && d.topExpenses.length)
      ? d.topExpenses.map((e,i) =>
          `<div class="tx"><div class="tx-inner"><div class="rank-badge">${i+1}</div>
           <div class="left"><div class="item">${esc(e.item||e.category)}</div>
           <div class="meta"><span class="cat">${esc(e.category)}</span> · ${esc(e.date)}</div></div></div>
           <div class="amt">${fmtINR(e.amount)}</div></div>`).join('')
      : '<div class="empty">No expenses logged yet.</div>';


  }

  load();
</script>
</body>
</html
