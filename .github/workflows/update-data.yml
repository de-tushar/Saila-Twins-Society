name: Update Dashboard Data

on:
  schedule:
    - cron: '30 2-16 * * *'  # every hour 8AM–10PM IST (2:30–16:30 UTC)
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

permissions:
  contents: write           # required to push data.json back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from Apps Script
        run: |
          curl -L -f -o data.json \
            "https://script.google.com/macros/s/AKfycbz23uiQuQGOapghi_ky6oQ3_xRFPxS-ogoj1cN4V5WiKaFGI4he4V90YM6P3T3tQcYV/exec?action=data"
          echo "--- data.json preview (first 200 chars) ---"
          head -c 200 data.json
          echo ""

      - name: Validate JSON
        run: |
          python3 -c "
          import json, sys
          try:
            with open('data.json') as f:
              d = json.load(f)
            if 'generatedAt' not in d:
              print('ERROR: generatedAt missing — Apps Script may have returned an error')
              sys.exit(1)
            print('JSON valid. generatedAt:', d.get('generatedAt'))
          except Exception as e:
            print('ERROR parsing JSON:', e)
            sys.exit(1)
          "

      - name: Commit and push if data changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add data.json
          if git diff --staged --quiet; then
            echo "No data change — skipping commit"
          else
            git commit -m "Update dashboard data"
            git push
            echo "Data updated and pushed successfully"
          fi
