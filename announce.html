<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saila Society — Notices</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saila Society">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --navy:#1F3A5F; --blue:#4472C4; --green:#2E7D32; --red:#C62828;
    --amber:#BF8F00; --teal:#00838F; --bg:#EEF2F7; --card:#ffffff;
    --mute:#7b8491; --border:#E2E8F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #1a1f2b; padding: 14px 12px 80px; font-size: 13px; }
  .header { margin-bottom: 18px; }
  .header h1 { font-size: 19px; font-weight: 700; color: var(--navy); letter-spacing: -0.3px; }
  .header .stamp { font-size: 11px; color: var(--mute); margin-top: 2px; }

  .announce-card {
    background: var(--card); border-radius: 12px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(20,35,60,0.07); overflow: hidden;
  }
  .announce-card .ac-top {
    padding: 12px 14px 10px;
    border-left: 4px solid var(--blue);
  }
  .announce-card.urgent .ac-top { border-left-color: var(--red); }
  .announce-card .ac-badge {
    display: inline-block; font-size: 9.5px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; margin-bottom: 7px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .announce-card.urgent .ac-badge { background: #FFEBEE; color: var(--red); }
  .announce-card.normal .ac-badge  { background: #E3F2FD; color: var(--blue); }
  .announce-card .ac-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .announce-card .ac-msg   { font-size: 12.5px; color: #2d3748; line-height: 1.6; }
  .announce-card .ac-footer {
    background: #f8fafc; padding: 7px 14px;
    font-size: 10.5px; color: var(--mute);
    border-top: 1px solid var(--border);
  }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--mute); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }

  .loading, .error { text-align: center; padding: 60px 20px; color: var(--mute); }
  .error { color: var(--red); }

  .refresh { position: fixed; bottom: 72px; right: 16px; background: var(--navy); color: #fff; border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; box-shadow: 0 4px 12px rgba(31,58,95,0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .refresh:active { transform: scale(0.95); }
  .refresh.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; height: 60px; box-shadow: 0 -2px 8px rgba(20,35,60,0.08); z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mute); font-size: 9.5px; font-weight: 600; letter-spacing: 0.3px; }
  .nav-item .nav-icon { font-size: 20px; line-height: 1; }
  .nav-item.active { color: var(--navy); }
</style>
</head>
<body>

<div class="header">
  <h1>📢 Society Notices</h1>
  <div class="stamp" id="stamp">Loading…</div>
</div>

<div id="content"></div>
<div id="loading" class="loading">Loading notices…</div>

<button class="refresh" id="refreshBtn" onclick="load()" title="Refresh">↻</button>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a class="nav-item" href="details.html"><span class="nav-icon">📊</span>Details</a>
  <a class="nav-item active" href="announce.html"><span class="nav-icon">📢</span>Notice</a>
  <a class="nav-item" href="tracker.html"><span class="nav-icon">🔧</span>Tracker</a>
  <a class="nav-item" href="raise.html"><span class="nav-icon">➕</span>Raise</a>
</nav>

<script>
  const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function load() {
    document.getElementById('refreshBtn').classList.add('spin');
    document.getElementById('content').innerHTML = '';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').className = 'loading';
    document.getElementById('loading').textContent = 'Loading notices…';

    fetch('./data.json?t=' + Date.now())
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(txt => {
        let d; try{d=JSON.parse(txt);}catch(ex){throw new Error('Bad JSON');}
        render(d);
        document.getElementById('refreshBtn').classList.remove('spin');
      })
      .catch(err => {
        document.getElementById('loading').className = 'error';
        document.getElementById('loading').textContent = 'Error: ' + err.message;
        document.getElementById('refreshBtn').classList.remove('spin');
      });
  }

  function render(d) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('stamp').textContent = 'Updated ' + (d.generatedAt || '');
    const el = document.getElementById('content');

    if (!d.announcements || d.announcements.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No active announcements right now.</p><p style="margin-top:8px;font-size:11.5px;">Check back later for society notices.</p></div>`;
      return;
    }

    el.innerHTML = d.announcements.map(a =>
      `<div class="announce-card ${a.priority==='Urgent'?'urgent':'normal'}">
        <div class="ac-top">
          <div class="ac-badge">${a.priority==='Urgent'?'🚨 Urgent':'📢 Notice'}</div>
          <div class="ac-title">${esc(a.title)}</div>
          <div class="ac-msg">${esc(a.message)}</div>
        </div>
        <div class="ac-footer">📅 Posted: ${esc(a.date)}</div>
      </div>`
    ).join('');
  }

  load();
</script>
<script src="auth.js"></script>
</body>
</html>
